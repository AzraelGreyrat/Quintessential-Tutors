<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Quintessential Tutors</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#fff;--tx:#222;--mut:#6b6b6b;--bd:#e4e4e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
html,body{background:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
#app{max-width:720px;margin:0 auto;padding:20px 16px 90px}
.stage{position:relative;text-align:center;padding:8px 0 24px;overflow:hidden}
.menu{position:absolute;z-index:2;left:0;top:0;background:none;border:0;color:var(--mut);font:inherit;font-size:.8rem;cursor:pointer}
.logo{position:relative;z-index:1;font-family:"Playfair Display",Georgia,serif;line-height:1.05;margin:6px 0 34px}
.logo i{display:block;font-size:1.3rem}.logo b{display:block;font-size:2rem;letter-spacing:.02em}
h2{position:relative;z-index:1;font:400 1.4rem "Playfair Display",Georgia,serif;margin:0}
.sub{position:relative;z-index:1;color:var(--mut);font-size:.75rem;font-style:italic;margin:2px 0 22px}
.deco{position:absolute;pointer-events:none;inset:0;z-index:0}
.deco .ell{position:absolute;left:4%;right:4%;top:22%;height:70%;border:1px solid #d9c48a;border-radius:50%;opacity:.7}
.deco .ay{position:absolute;left:5%;top:15%;bottom:6%;width:1px;background:var(--mut);opacity:.5}
.deco .ax{position:absolute;left:4%;right:4%;bottom:6%;height:1px;background:var(--mut);opacity:.5}
.deco .dot{position:absolute;width:9px;height:9px;border-radius:50%}
.grid{position:relative;z-index:1;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.card{position:relative;flex:1 0 128px;min-height:340px;scroll-snap-align:center;border:0;border-top:4px solid var(--c);border-radius:4px;background:linear-gradient(color-mix(in srgb,var(--c) 22%,var(--bg)),var(--bg));color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:14px 8px;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.card .kj{position:absolute;top:22px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;font-size:3.4rem;font-weight:700;color:var(--c);opacity:.4}
.card .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font-size:.8rem;display:none;place-items:center}
.card:hover .ck{display:grid}
.card .nm{font:600 1.1rem "Playfair Display",Georgia,serif}
.card .tg{font-size:.75rem;color:var(--mut)}
.av{width:52px;height:52px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:700;margin-bottom:8px}
.card b{font-size:1.1rem}.card small{display:block;color:var(--mut)}
.card p{margin:8px 0 0;font-size:.9rem}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .av{margin:0;width:40px;height:40px;font-size:1.1rem}
.top button,.send,.play{border:1px solid var(--bd);background:var(--card);color:inherit;border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.top label{margin-left:auto;font-size:.85rem;color:var(--mut)}
.msg{max-width:88%;margin:10px 0;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card)}
.msg.me{margin-left:auto;background:var(--c);color:#fff;border-color:transparent}
.msg.on{outline:2px solid var(--c)}
.en{font-size:1rem}
.ja{font-size:.85rem;color:var(--mut);margin-top:6px}
.play{margin-top:6px;padding:2px 10px;font-size:.8rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:720px;margin:0 auto;display:flex;gap:8px}
.bar input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:inherit;font:inherit}
.send{background:var(--c);color:#fff;border-color:transparent}
.hide{display:none}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(transparent,var(--bg))}
.card .nm,.card .tg,.card .ck{z-index:1}
.card .tg{margin-top:2px}
.lesson{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr auto auto;gap:10px;height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.lhead{grid-column:1/3;display:flex;align-items:center;gap:6px;font-size:.85rem}
.lhead .lg{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:1rem;margin-right:auto}
.lhead button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:4px 8px}
.lhead label{color:var(--mut);margin-left:6px}
.pane{background:var(--card);border:1px solid var(--bd);border-radius:6px;overflow:hidden;position:relative;min-height:0}
.qpane{background:linear-gradient(color-mix(in srgb,var(--c) 22%,var(--bg)),var(--bg))}
.qpane img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.qpane .nm{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:600 1rem "Playfair Display",Georgia,serif}
.qpane.on img{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.board{overflow-y:auto;padding:14px 20px;font-family:Georgia,serif}
.board .q{color:var(--mut);font:.85rem system-ui,sans-serif;border-left:3px solid var(--c);padding-left:8px;margin:14px 0 8px}
.board h3{margin:12px 0 4px;font-size:1.1rem}
.board .p{margin:6px 0}
.board .eq{text-align:center;font-size:1.3rem;font-style:italic;margin:12px 0;overflow-x:auto}
.board .note{color:var(--mut);font-size:.85rem;margin:6px 0}
.board .empty{color:var(--mut);text-align:center;margin-top:18%}
.talkbox{grid-column:1/3;padding:10px 14px;max-height:28vh;overflow-y:auto}
.talkbox .en{font-size:.95rem}
.ask{grid-column:1/3;display:flex;gap:8px}
.ask input{flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:inherit;font:inherit}
@media(max-width:640px){.lesson{grid-template-columns:1fr;grid-template-rows:auto 140px 1fr auto auto}.lhead,.talkbox,.ask{grid-column:1}}
</style></head>
<body><div id="app"></div>
<div class="bar hide" id="bar"><div><input id="q" placeholder="Ask your tutor anything..." autocomplete="off"><button class="send" id="go">Send</button></div></div>

const app=document.getElementById("app"),bar=document.getElementById("bar"),inp=document.getElementById("q");
let cur=null,hist=[],voiceOn=true,log=null;
function el(t,cls,txt){const e=document.createElement(t);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function pick(){
 cur=null;hist=[];speechSynthesis.cancel();bar.classList.add("hide");app.replaceChildren();
 app.style.maxWidth="980px";app.style.padding="";
 const st=el("div","stage"),dc=el("div","deco");
 dc.innerHTML='<div class="ell"></div><div class="ay"></div><div class="ax"></div><div class="dot" style="left:9%;top:14%;background:#4a8fd6"></div><div class="dot" style="right:12%;top:12%;background:#8b7bd6;width:6px;height:6px"></div><div class="dot" style="right:20%;bottom:9%;background:#e9a23b;width:6px;height:6px"></div>';
 const menu=el("button","menu","\u2039 Menu");menu.onclick=pick;
 const logo=el("div","logo");logo.innerHTML="<i>The</i><b>Quintessential</b><b>Tutors</b>";
 const g=el("div","grid");
 Q.forEach(q=>{const b=el("button","card");b.style.setProperty("--c",q.c);
  const im=el("img");im.src=IMG[q.n];im.alt=q.n;b.append(im,el("div","ck","\u2713"),el("div","nm",q.n));
  b.onclick=()=>start(q);g.append(b)});
 st.append(dc,menu,logo,el("h2",0,"Choose your guide"),el("p","sub","five sisters, five ways to understand"),g);
 app.append(st);
}
let board,talk,qp,inp2;
function emptyB(){board.replaceChildren(el("div","empty","The whiteboard is empty. Ask "+cur.n+" anything."))}
function start(q){
 cur=q;hist=[];app.replaceChildren();Object.assign(app.style,{maxWidth:"1200px",padding:"12px"});app.style.setProperty("--c",q.c);
 const L=el("div","lesson"),H=el("div","lhead");
 const back=el("button",0,"\u2039 Menu");back.onclick=pick;
 const nw=el("button",0,"+ New");nw.onclick=()=>{speechSynthesis.cancel();hist=[];emptyB();tutor(q.h)};
 const lab=el("label"),cb=el("input");cb.type="checkbox";cb.checked=voiceOn;cb.onchange=()=>{voiceOn=cb.checked;if(!voiceOn)speechSynthesis.cancel()};lab.append(cb," Voice");
 H.append(el("div","lg","The Quintessential Tutors"),back,el("b",0,q.n),nw,lab);
 qp=el("div","pane qpane");const im=el("img");im.src=IMG[q.n];im.alt=q.n;qp.append(im,el("div","nm",q.n));
 board=el("div","pane board");talk=el("div","pane talkbox");
 const ask=el("div","ask");inp2=el("input");inp2.placeholder="Ask "+q.n+"... (Enter to send)";inp2.autocomplete="off";
 const go=el("button","send","Send");go.onclick=send;inp2.onkeydown=e=>{if(e.key==="Enter")send()};ask.append(inp2,go);
 L.append(H,qp,board,talk,ask);app.append(L);
 emptyB();tutor(q.h);inp2.focus();
}
function speak(ja,node){
 if(!window.speechSynthesis)return;speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(ja);u.lang="ja-JP";u.pitch=cur.pitch;u.rate=Math.min(cur.rate,2);
 const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().startsWith("ja"));if(v)u.voice=v;
 u.onstart=()=>node.classList.add("on");u.onend=u.onerror=()=>node.classList.remove("on");
 speechSynthesis.speak(u);
}
function tutor(m){
 talk.replaceChildren(el("div","en",m.en),el("div","ja",m.ja));
 const p=el("button","play","Play voice");p.onclick=()=>speak(m.ja,qp);talk.append(p);
 if(Array.isArray(m.board))draw(m.board);
 hist.push("Tutor: "+m.en);
 if(voiceOn)speak(m.ja,qp);
}
function draw(b){
 const e=board.querySelector(".empty");if(e)e.remove();
 b.forEach(x=>{const t=String(x.type);
  board.append(el(t==="h"?"h3":"div",t==="eq"?"eq":t==="note"?"note":t==="h"?"":"p",String(x.text)))});
 board.scrollTop=board.scrollHeight;
}
async function send(){
 const text=inp2.value.trim();if(!text||!cur)return;inp2.value="";
 const e=board.querySelector(".empty");if(e)e.remove();
 board.append(el("div","q",text));board.scrollTop=board.scrollHeight;
 talk.replaceChildren(el("div","en","..."));
 const prompt="You are "+cur.n+" from The Quintessential Quintuplets, tutoring a student. Personality: "+cur.p+
  " Stay in character. What you SAY (ja and en) is a short spoken explanation, max 4 sentences, that points at the whiteboard instead of reading formulas aloud. Put the real lesson on the whiteboard as 2-6 blocks: h (heading), p (short line), eq (formula or worked step; use Unicode math like x², a₀, →, √, ×, never LaTeX), note (aside). Add a tiny check question when useful. "+
  'Reply ONLY with JSON {"ja":"natural spoken Japanese, plain text, no romaji","en":"faithful English translation used as subtitles","board":[{"type":"h","text":"..."}]}\nConversation so far:\n'+
  hist.slice(-8).join("\n")+"\nStudent: "+text;
 hist.push("Student: "+text);
 try{
  const res=await fetch("/.netlify/functions/tutor",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  if(!res.ok)throw new Error(res.status===429?"The tutor is busy right now. Try again in a minute.":"The tutor could not answer (error "+res.status+").");
  const r=await res.json();
  tutor({ja:String(r.ja),en:String(r.en),board:r.board});
 }catch(err){talk.replaceChildren(el("div","en","Sorry, I couldn't answer that: "+(err.message||err.code||"error")));}
}
if(window.speechSynthesis)speechSynthesis.getVoices();
pick();
</script></body></html>
